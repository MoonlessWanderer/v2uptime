{% extends "base.html" %}
{% block html_lang %}{{ lang|default('en') }}{% endblock %}
{% block html_dir %}{{ dir|default('ltr') }}{% endblock %}
{% block title %}{{ t('error_title') }} {{ code }}{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="panel login-card" style="text-align:center">
    <h1><bdi>{{ code }}</bdi></h1>
    <p class="muted">{{ message }}</p>
    <a class="btn" href="/">{{ t('error_back') }}</a>
  </div>
</div>
{% endblock %}
