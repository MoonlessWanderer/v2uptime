{% extends "admin/base.html" %}
{% block page_title %}تغییر رمز{% endblock %}
{% block content %}
<div class="page-head"><h1>تغییر رمز عبور</h1></div>
<form method="post" action="{{ admin_url('/password') }}" class="panel" style="max-width:520px" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="text" name="username" value="{{ admin.username }}" autocomplete="username" hidden>
  <div class="field"><label for="current">رمز فعلی</label><input type="password" id="current" name="current" required autocomplete="current-password" class="ltr"></div>
  <div class="field" style="margin-top:12px"><label for="new">رمز جدید</label><input type="password" id="new" name="new" required minlength="10" autocomplete="new-password" class="ltr"><span class="help">حداقل ۱۰ کاراکتر. با تغییر رمز، بقیه نشست‌ها خارج می‌شوند.</span></div>
  <div class="field" style="margin-top:12px"><label for="confirm">تکرار رمز جدید</label><input type="password" id="confirm" name="confirm" required minlength="10" autocomplete="new-password" class="ltr"></div>
  <div class="form-actions"><button class="btn btn-primary" type="submit">تغییر رمز</button></div>
</form>
{% endblock %}
