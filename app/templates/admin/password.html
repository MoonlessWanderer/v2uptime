{% extends "admin/base.html" %}
{% block page_title %}Password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<form method="post" action="{{ admin_url('/password') }}" class="panel" style="max-width:520px" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="text" name="username" value="{{ admin.username }}" autocomplete="username" hidden>
  <div class="field"><label for="current">Current password</label><input type="password" id="current" name="current" required autocomplete="current-password" class="ltr"></div>
  <div class="field" style="margin-top:12px"><label for="new">New password</label><input type="password" id="new" name="new" required minlength="10" autocomplete="new-password" class="ltr"><span class="help">At least 10 characters. Other sessions are signed out.</span></div>
  <div class="field" style="margin-top:12px"><label for="confirm">Repeat new password</label><input type="password" id="confirm" name="confirm" required minlength="10" autocomplete="new-password" class="ltr"></div>
  <div class="form-actions"><button class="btn btn-primary" type="submit">Change password</button></div>
</form>
{% endblock %}
